[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "racetrack-lab"
version = "0.1.0"
description = "Racetrack Visual Lab - a passive viewer for racetrack MDP experiments"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.40", "plotly>=5.20", "numpy>=1.24"]

# Only the viewer is a package. Your algorithm code stays yours: it just
# imports racetrack_lab from anywhere once this is installed with `pip install -e .`
[tool.setuptools.packages.find]
include = ["racetrack_lab*"]

[tool.setuptools.package-data]
"racetrack_lab.canvas" = ["frontend/*"]
